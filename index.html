<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dive in</title>
<style>
  /* Everything you make goes inside #stage: exactly 800 × 400 pixels. The gallery shows
     this box (shrunk to fit), so anything outside it won't be seen. */
  html, body { margin: 0; background: #292b47; color: #eceae3; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }

  #stage {
    width: 800px; height: 400px; overflow: hidden; position: relative;
    display: grid; place-items: center; text-align: center;
    background: #000;
    transition: background 1.6s cubic-bezier(.4, 0, .2, 1);
  }

  /* ---- the ocean ---- */
  #stage.ocean {
    background:
      radial-gradient(140% 115% at 50% -20%, #4bb6e8 0%, #1a8ac9 28%, #0d6199 54%, #074570 78%, #022741 100%);
  }

  #rays, #fishLayer, #bubbles {
    position: absolute; inset: 0; pointer-events: none;
    opacity: 0; transition: opacity 2s ease .2s;
  }
  #stage.ocean #rays, #stage.ocean #fishLayer, #stage.ocean #bubbles { opacity: 1; }

  /* soft sunbeams drifting down into the water */
  #rays {
    background:
      linear-gradient(102deg, transparent 8%, rgba(190, 236, 255, .10) 14%, transparent 20%),
      linear-gradient(96deg,  transparent 32%, rgba(190, 236, 255, .07) 39%, transparent 46%),
      linear-gradient(108deg, transparent 62%, rgba(190, 236, 255, .09) 69%, transparent 76%),
      linear-gradient(92deg,  transparent 86%, rgba(190, 236, 255, .06) 92%, transparent 97%);
    animation: drift 11s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }
  @keyframes drift {
    from { transform: translateX(-18px) scaleY(1); opacity: .55; }
    to   { transform: translateX(18px)  scaleY(1.08); opacity: 1; }
  }

  /* ---- kaomoji fish ---- */
  .fish {
    position: absolute; left: 0; top: 0;
    font-size: var(--size); line-height: 1; white-space: pre;
    color: var(--c);
    text-shadow: 0 0 12px rgba(140, 225, 255, .45);
    will-change: transform;
    transform-origin: 50% 50%;
  }
  .fish .glyph {
    display: inline-block;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "MS Gothic", monospace;
    letter-spacing: -0.02em;
  }

  /* catching: fish are clickable, with a little extra invisible hit area */
  .fish { pointer-events: auto; cursor: pointer; }
  .fish::after { content: ""; position: absolute; inset: -10px; }
  .fish:hover .glyph { color: #fff; text-shadow: 0 0 18px #b9ecff, 0 0 6px #fff; }
  .fish.caught { pointer-events: none; cursor: default; }
  .fish.caught .glyph { animation: caughtGlyph .5s ease-out forwards; }
  @keyframes caughtGlyph {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    35%  { transform: translateY(-12px) scale(1.5) rotate(8deg); opacity: 1; }
    100% { transform: translateY(-26px) scale(.4) rotate(20deg); opacity: 0; }
  }

  /* ripple where a fish was caught */
  .ripple {
    position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border: 1px solid rgba(210, 245, 255, .9);
    border-radius: 50%; pointer-events: none;
    animation: rippleOut .65s ease-out forwards;
  }
  @keyframes rippleOut {
    from { transform: scale(.4); opacity: 1; }
    to   { transform: scale(7); opacity: 0; }
  }

  /* air bubbles puffed out of a fish's mouth */
  .puff {
    position: absolute; left: 0; top: 0;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: var(--size); line-height: 1;
    color: rgba(224, 247, 255, .92);
    text-shadow: 0 0 8px rgba(150, 230, 255, .55);
    pointer-events: none;
    will-change: transform, opacity;
    animation: puffUp var(--dur) ease-out forwards;
  }
  @keyframes puffUp {
    from { transform: translate(var(--x), var(--y)) scale(.5); opacity: 0; }
    20%  { opacity: .9; }
    to   { transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) - 110px)) scale(1.15); opacity: 0; }
  }

  /* ---- bubbles ---- */
  .bubble {
    position: absolute; bottom: -30px; left: var(--x);
    width: var(--r); height: var(--r); border-radius: 50%;
    border: 1px solid rgba(190, 236, 255, .55);
    background: radial-gradient(circle at 32% 30%, rgba(210, 244, 255, .65), rgba(120, 200, 240, .06) 60%, transparent 70%);
    animation: rise var(--dur) linear infinite;
    animation-delay: var(--delay);
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(.9); opacity: 0; }
    10%  { opacity: .8; }
    60%  { transform: translate(var(--wobble), -260px) scale(1); }
    100% { transform: translate(calc(var(--wobble) * -1), -460px) scale(1.1); opacity: 0; }
  }

  /* ---- the button: a page torn out of a notebook ---- */
  .scene {
    position: relative; z-index: 2;
    display: grid; gap: 22px; place-items: center;
    transition: opacity .9s ease, transform .9s cubic-bezier(.4, 0, .2, 1);
  }

  .tagline {
    margin: 0;
    font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: 15px; color: #7c84a8;
    transform: rotate(-1.2deg);
  }

  #dive {
    position: relative;
    padding: 18px 44px 24px 46px;
    border: 1px solid #e6ddc4;
    border-radius: 3px;
    cursor: pointer;
    font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: 26px; line-height: 1;
    color: #27456f;
    background-color: #fbf6e7;
    background-image:
      repeating-linear-gradient(to bottom, transparent 0 27px, rgba(96, 150, 205, .35) 27px 28px);
    background-position: 0 14px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .9) inset,
      0 16px 32px rgba(0, 0, 0, .55),
      0 3px 6px rgba(0, 0, 0, .45);
    transform: rotate(-2deg);
    transition: transform .25s cubic-bezier(.2, .9, .3, 1.4), box-shadow .3s ease,
                background-color .3s ease, opacity .9s ease;
  }

  /* the red margin rule down the page */
  #dive::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 30px;
    width: 1px; background: rgba(214, 96, 96, .5);
    pointer-events: none;
  }

  /* a strip of tape holding the page down */
  #dive::after {
    content: ""; position: absolute; top: -13px; left: 50%;
    width: 96px; height: 26px;
    transform: translateX(-50%) rotate(2.5deg);
    background: linear-gradient(180deg, rgba(255, 252, 235, .9), rgba(242, 235, 210, .82));
    border-left: 1px dashed rgba(120, 110, 80, .3);
    border-right: 1px dashed rgba(120, 110, 80, .3);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3), inset 0 0 0 1px rgba(255, 255, 255, .3);
    pointer-events: none;
  }

  .btn-text {
    position: relative; z-index: 1;
    text-decoration: underline wavy rgba(39, 69, 111, .38);
    text-underline-offset: 7px; text-decoration-thickness: 1.5px;
  }
  .btn-fish {
    position: relative; z-index: 1;
    margin-left: .45em;
    font-family: ui-monospace, "MS Gothic", monospace;
    font-size: .58em; letter-spacing: 0;
    opacity: .8; display: inline-block;
    transform: translateY(-2px) rotate(-5deg);
  }

  #dive:hover {
    transform: rotate(0deg) translateY(-3px) scale(1.03);
    background-color: #fffdf2;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .95) inset,
      0 22px 40px rgba(0, 0, 0, .55),
      0 3px 6px rgba(0, 0, 0, .45);
  }
  #dive:active {
    transform: rotate(-1deg) translateY(1px) scale(.99);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .8) inset,
      0 8px 18px rgba(0, 0, 0, .5);
  }
  #dive:focus-visible { outline: 2px dashed #a8d8ff; outline-offset: 7px; }

  /* ---- catcher's notes: fish counter + sea volume ---- */
  #hud {
    position: absolute; top: 16px; left: 18px; z-index: 3;
    display: flex; gap: 10px; align-items: center;
    opacity: 0; transform: translateY(-6px);
    transition: opacity 1s ease .9s, transform 1s ease .9s;
    pointer-events: none;
    font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
  }
  #stage.ocean #hud { opacity: 1; transform: none; }

  .hud-note {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 7px 12px 8px;
    background: #fbf6e7;
    border: 1px solid #e6ddc4;
    border-radius: 2px;
    color: #27456f; font-size: 13px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .4);
    transform: rotate(-1.2deg);
  }
  .hud-note:nth-child(2) { transform: rotate(.9deg); }
  .hud-label { font-size: 11px; color: #6b7ba2; white-space: nowrap; }
  .hud-label em {
    font-style: normal; color: #9fabc8;
    transition: opacity .6s ease;
  }
  .hud-note b { font-weight: 600; font-size: 15px; display: inline-block; }
  .hud-note b.bump { animation: bump .32s ease-out; }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.45) rotate(-4deg); color: #0d5f9e; }
    100% { transform: scale(1); }
  }

  .vol-track {
    position: relative; display: inline-block;
    width: 58px; height: 6px; border-radius: 3px;
    background: rgba(39, 69, 111, .16);
    overflow: hidden;
  }
  .vol-track i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 12%;
    border-radius: 3px;
    background: linear-gradient(90deg, #3ea9ea, #0d5f9e);
    transition: width .55s cubic-bezier(.2, .9, .3, 1);
  }
  .hud-note.low .vol-track i { background: linear-gradient(90deg, #e58080, #a03355); }
  .hud-note.low b { color: #a03355; }

  #mute {
    pointer-events: auto; cursor: pointer;
    width: 30px; height: 30px; padding: 0;
    border: 1px solid #e6ddc4; border-radius: 50%;
    background: #fbf6e7; color: #27456f;
    font-family: inherit; font-size: 14px; line-height: 1;
    transform: rotate(4deg);
    box-shadow: 0 6px 14px rgba(0, 0, 0, .35);
  }
  #mute[aria-pressed="true"] { color: #b25a5a; text-decoration: line-through; }

  #endnote {
    position: absolute; left: 50%; bottom: 26px; z-index: 3;
    margin: 0; padding: 10px 18px;
    background: #fbf6e7; border: 1px solid #e6ddc4; border-radius: 2px;
    color: #27456f;
    font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: 15px; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transform: translate(-50%, 10px) rotate(-1.5deg);
    transition: opacity .5s ease, transform .5s ease;
    box-shadow: 0 10px 26px rgba(0, 0, 0, .45);
  }
  #endnote.show { opacity: 1; transform: translate(-50%, 0) rotate(-1.5deg); }

  #current {
    position: absolute; top: 20px; right: 20px; z-index: 3;
    margin: 0; pointer-events: none;
    font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: 14px; color: #d9f1ff;
    text-shadow: 0 0 12px rgba(140, 215, 255, .75);
    opacity: 0; transform: translateY(-7px);
    transition: opacity .5s ease, transform .5s ease;
  }
  #stage.current #current { opacity: 1; transform: none; }

  #stage.ocean .scene {
    opacity: 0; pointer-events: none;
    transform: translateY(16px) scale(.94);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="rays"></div>
  <div id="fishLayer" aria-hidden="true"></div>
  <div id="bubbles" aria-hidden="true"></div>

  <div id="hud" aria-live="polite">
    <div class="hud-note">
      <span class="hud-label">fish left <em id="hint">(click one)</em></span>
      <b id="fishLeft">12</b>
    </div>
    <div class="hud-note">
      <span class="hud-label">sea volume &#8600;</span>
      <span class="vol-track"><i id="volFill"></i></span>
      <b id="volPct">12%</b>
    </div>
    <button id="mute" type="button" aria-label="mute the sea" aria-pressed="false">♪</button>
  </div>

  <p id="current">the current picks up</p>
  <p id="endnote"></p>
  <div class="scene">
    <p class="tagline">the water is warm</p>
    <button id="dive" type="button">
      <span class="btn-text">dive in</span>
      <span class="btn-fish" aria-hidden="true">＞゜))))彡</span>
    </button>
  </div>
</div>
<script>
  const stage = document.getElementById('stage');
  const fishLayer = document.getElementById('fishLayer');
  const bubbleLayer = document.getElementById('bubbles');

  // every fish is a tiny kaomoji animation: two body frames (tail flicker / squish),
  // a smooth swim with a stroke-pulse, a bob, a tilt, and bubble puffs from the mouth.
  const FISH_FRAMES = {
    right: [
      ['><(((°>', '><(((゜>'],
      ['彡(((°>', 'ミ(((°>'],
      ['><((((°>', '><(((°>']
    ],
    left: [
      ['<°)))彡', '<゜)))彡'],
      ['<°)))彡', '<°)))ミ'],
      ['<°))))彡', '<°)))彡']
    ]
  };
  const COLORS = ['#8fdcff', '#b3ecff', '#5fc4f0', '#cbf4ff', '#74cff5', '#e0f8ff'];

  const rand = (min, max) => min + Math.random() * (max - min);
  const pick = (list) => list[(Math.random() * list.length) | 0];

  const hintEl = document.getElementById('hint');
  const fishLeftEl = document.getElementById('fishLeft');
  const volFillEl = document.getElementById('volFill');
  const volPctEl = document.getElementById('volPct');
  const muteBtn = document.getElementById('mute');

  const TOTAL = 12;
  let remaining = TOTAL;
  let caughtCount = 0;
  let volumeLevel = 0.12;
  let muted = false;
  let audio = null;

  // the fish get faster the longer you play; the sea gets quieter unless you keep catching
  let swimTime = 0;
  let pace = 0;
  let volTick = 0;
  let round = 1;
  let noteTimer = 0;

  const endnoteEl = document.getElementById('endnote');

  function showNote(text) {
    endnoteEl.textContent = text;
    endnoteEl.classList.add('show');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => endnoteEl.classList.remove('show'), 2600);
  }

  // a rising tide: every few seconds the whole school speeds up, harder each time
  let surge = 0;
  let surgeTimer = 3500;
  let surgeCount = 0;

  const fish = [];
  let lastT = 0;

  // ---- sea audio: brown noise through a sweeping low-pass, plus surf swells ----
  function startOcean() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;

    const ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();

    const len = Math.floor(ctx.sampleRate * 4);
    const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.2;
    }
    // crossfade the loop seam so it doesn't tick every 4 seconds
    const fade = Math.floor(ctx.sampleRate * 0.5);
    for (let i = 0; i < fade; i++) {
      const k = i / fade;
      data[i] = data[i] * k + data[len - fade + i] * (1 - k);
    }

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 750;
    lp.Q.value = 0.4;

    const swell = ctx.createGain();
    swell.gain.value = 0.72;

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.08;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 320;
    lfo.connect(lfoGain).connect(lp.frequency);

    const surf = ctx.createOscillator();
    surf.frequency.value = 0.11;
    const surfGain = ctx.createGain();
    surfGain.gain.value = 0.22;
    surf.connect(surfGain).connect(swell.gain);

    const master = ctx.createGain();
    master.gain.value = 0.0001;

    const sfx = ctx.createGain();
    sfx.gain.value = 0.6;

    src.connect(lp).connect(swell).connect(master).connect(ctx.destination);
    sfx.connect(ctx.destination);

    src.start();
    lfo.start();
    surf.start();

    audio = { ctx, master, sfx };
    applyVolume();
  }

  function applyVolume() {
    const gain = volumeLevel <= 0 ? 0 : 0.012 + 0.42 * Math.pow(volumeLevel, 1.3);
    if (audio) {
      audio.master.gain.setTargetAtTime(muted ? 0 : gain, audio.ctx.currentTime, 0.3);
    }
    volFillEl.style.width = (volumeLevel * 100).toFixed(0) + '%';
    volPctEl.textContent = Math.max(0, Math.round(volumeLevel * 100)) + '%';
    volPctEl.closest('.hud-note').classList.toggle('low', volumeLevel < 0.18);
  }

  function boostVolume(amount) {
    volumeLevel = Math.min(1, volumeLevel + amount);
    applyVolume();
  }

  function resumeAudio() {
    if (audio && audio.ctx.state === 'suspended') audio.ctx.resume();
  }

  function plop() {
    if (!audio || muted) return;
    const { ctx, sfx } = audio;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(620 + Math.random() * 260, t);
    osc.frequency.exponentialRampToValueAtTime(170, t + 0.18);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);

    osc.connect(g).connect(sfx);
    osc.start(t);
    osc.stop(t + 0.26);
  }

  function createFish(i, fromEdge) {
    const W = stage.clientWidth, H = stage.clientHeight;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const size = rand(15, 34);
    const depth = (size - 15) / 19;              // bigger fish read as closer
    const frames = pick(FISH_FRAMES[dir > 0 ? 'right' : 'left']);

    const el = document.createElement('div');
    el.className = 'fish';
    el.style.setProperty('--size', size.toFixed(0) + 'px');
    el.style.setProperty('--c', COLORS[i % COLORS.length]);
    el.style.opacity = (0.4 + depth * 0.6).toFixed(2);

    const glyph = document.createElement('span');
    glyph.className = 'glyph';
    glyph.textContent = frames[0];
    el.appendChild(glyph);
    fishLayer.appendChild(el);

    const f = {
      el, glyph, frames,
      dir,
      size,
      // replacements slip in from an edge, so the water is never empty
      x: fromEdge ? (dir > 0 ? -130 : W + 130) : rand(-180, W),
      baseY: fromEdge ? rand(24, H - 60) : 28 + ((i % 9) / 9) * (H - 90) + rand(-14, 14),
      speed: rand(72, 112) * (0.65 + depth * 0.9) * (1 + (round - 1) * 0.16),
      phase: rand(0, Math.PI * 2),
      bobAmp: rand(3, 9),
      bobSpd: rand(0.9, 1.8),
      frame: 0,
      frameMs: rand(90, 200),
      frameEvery: rand(115, 185),
      puffMs: rand(900, 4000),
      boost: 0,
      caught: false
    };

    el.addEventListener('click', () => catchFish(f));
    fish.push(f);
  }

  function addFish(count) {
    for (let i = 0; i < count; i++) createFish(i, false);
  }

  function catchFish(f) {
    if (f.caught || remaining <= 0) return;
    f.caught = true;
    resumeAudio();

    const i = fish.indexOf(f);
    if (i > -1) fish.splice(i, 1);

    const sr = stage.getBoundingClientRect();
    const gr = f.glyph.getBoundingClientRect();
    const cx = gr.left + gr.width / 2 - sr.left;
    const cy = gr.top + gr.height / 2 - sr.top;

    f.el.classList.add('caught');
    setTimeout(() => f.el.remove(), 520);

    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.left = cx + 'px';
    ripple.style.top = cy + 'px';
    ripple.addEventListener('animationend', () => ripple.remove());
    bubbleLayer.appendChild(ripple);

    remaining -= 1;
    caughtCount += 1;
    fishLeftEl.textContent = remaining;
    fishLeftEl.classList.remove('bump');
    void fishLeftEl.offsetWidth;
    fishLeftEl.classList.add('bump');
    hintEl.style.opacity = '0';
    setTimeout(() => hintEl.remove(), 800);

    createFish(caughtCount % COLORS.length, true);   // a new fish swims in right away

    plop();
    boostVolume(0.14);

    if (remaining === 0) {
      setTimeout(() => {
        round += 1;
        remaining = TOTAL;
        fishLeftEl.textContent = remaining;
        showNote('a new school — round ' + round + ', faster fish');
      }, 500);
    }
  }

  function blow(f) {
    const sr = stage.getBoundingClientRect();
    const gr = f.glyph.getBoundingClientRect();
    const mouthX = (f.dir > 0 ? gr.right + 2 : gr.left - 2) - sr.left;
    const mouthY = gr.top - sr.top + gr.height * 0.5;
    const count = 1 + ((Math.random() * 3) | 0);
    const chars = ['°', 'o', 'O'];

    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const puff = document.createElement('span');
        puff.className = 'puff';
        puff.textContent = chars[i % chars.length];
        puff.style.setProperty('--size', (f.size * (0.45 + i * 0.14)).toFixed(1) + 'px');
        puff.style.setProperty('--x', (mouthX + f.dir * i * 4).toFixed(1) + 'px');
        puff.style.setProperty('--y', (mouthY - i * 3).toFixed(1) + 'px');
        puff.style.setProperty('--dx', (-f.dir * rand(10, 34)).toFixed(0) + 'px');
        puff.style.setProperty('--dur', rand(1.2, 2).toFixed(2) + 's');
        puff.addEventListener('animationend', () => puff.remove());
        bubbleLayer.appendChild(puff);
      }, i * 240);
    }
  }

  function swim(t) {
    const dt = Math.min(50, t - lastT || 16);
    lastT = t;
    const W = stage.clientWidth, H = stage.clientHeight;

    // time makes the school faster and the sea quieter — catches are the only way back up
    if (remaining > 0) {
      swimTime += dt;
      pace = Math.min(2.2, swimTime * 0.000026);
      volumeLevel = Math.max(0, volumeLevel - dt * 0.000016);
      volTick += dt;
      if (volTick > 120) {
        volTick = 0;
        applyVolume();
      }
    }

    // the tide arrives in waves, and every wave is stronger than the last
    if (surge <= 0 && remaining > 0) {
      surgeTimer -= dt;
      if (surgeTimer <= 0) {
        surgeCount += 1;
        surge = Math.min(2.2, 0.9 + surgeCount * 0.32);
        surgeTimer = rand(6000, 9500);
        stage.classList.add('current');
        for (const f of fish) f.boost = Math.max(f.boost, rand(0.3, 1.2));
      }
    } else if (surge > 0) {
      surge = Math.max(0, surge - dt * 0.00055);
      if (surge === 0) stage.classList.remove('current');
    }

    for (const f of fish) {
      // stroke-pulse: water pushed on every tail beat
      f.phase += dt * 0.001 * f.bobSpd;
      const pulse = 0.62 + 0.38 * Math.sin(f.phase * 2.6);
      f.boost = Math.max(0, f.boost - dt * 0.0011);
      if (Math.random() < dt * 0.00009) f.boost = 0.9 + surge * 0.4;  // sudden dart
      f.x += f.dir * f.speed * (pulse + f.boost + surge + pace) * dt * 0.001;

      const y = f.baseY + Math.sin(f.phase) * f.bobAmp;
      const vy = Math.cos(f.phase) * f.bobAmp * f.bobSpd;
      const tilt = Math.atan2(vy, f.speed * (1 + surge + pace)) * 28;   // nose follows the arc

      f.el.style.transform =
        'translate3d(' + f.x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + tilt.toFixed(2) + 'deg)';

      // tail / body frame flip
      f.frameMs -= dt;
      if (f.frameMs <= 0) {
        f.frame = (f.frame + 1) % f.frames.length;
        f.glyph.textContent = f.frames[f.frame];
        f.frameMs = f.frameEvery + rand(-25, 25);
      }

      // the blow-bubbles sequence: a small burst every few seconds
      f.puffMs -= dt;
      if (f.puffMs <= 0) {
        if (f.x > -20 && f.x < W) blow(f);
        f.puffMs = rand(3200, 6500);
      }

      // leave one edge, come back on the other
      if ((f.dir > 0 && f.x > W + 200) || (f.dir < 0 && f.x < -200)) {
        f.x = f.dir > 0 ? -200 : W + 200;
        f.baseY = rand(24, H - 60);
        f.phase = rand(0, Math.PI * 2);
        f.puffMs = rand(700, 3200);
      }
    }

    requestAnimationFrame(swim);
  }

  function addBubbles(count) {
    for (let i = 0; i < count; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.style.setProperty('--x', rand(2, 98).toFixed(1) + '%');
      bubble.style.setProperty('--r', rand(3, 11).toFixed(0) + 'px');
      bubble.style.setProperty('--dur', rand(7, 16).toFixed(1) + 's');
      bubble.style.setProperty('--delay', (-Math.random() * 16).toFixed(1) + 's');
      bubble.style.setProperty('--wobble', rand(10, 34).toFixed(0) + 'px');
      bubbleLayer.appendChild(bubble);
    }
  }

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
    resumeAudio();
    applyVolume();
  });

  document.getElementById('dive').addEventListener('click', () => {
    stage.classList.add('ocean');
    startOcean();
    // let the water settle for a moment before the fish swim in
    setTimeout(() => {
      addFish(TOTAL);
      addBubbles(18);
      requestAnimationFrame(swim);
    }, 650);
  }, { once: true });
</script>
</body>
